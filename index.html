<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>ปิดไฟโรงงาน — Safran Cabin Lamphun</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--line:#3a5a96;--text:#f2f6fb;--mute:#aebfdc;--lamp:#ffc83d;--ok:#5ee2a0;--bad:#ff6b5e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;overflow:hidden;background:#0a1426;color:var(--text);font-family:'Kanit','Noto Sans Thai',sans-serif;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
body{display:flex;flex-direction:column;isolation:isolate}
body::before{content:'';position:fixed;inset:0;z-index:-1;background:var(--img) center/cover;filter:blur(9px) saturate(.8);transform:scale(1.06)}
body::after{content:'';position:fixed;inset:0;z-index:-1;background:linear-gradient(rgba(8,16,34,.8),rgba(8,16,34,.93))}
#bar{position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--lamp);transform-origin:left}
#hud{flex:none;position:relative;overflow:hidden;width:520px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:7px 18px 11px;background:rgba(18,36,72,.94);border:1px solid rgba(130,170,240,.3);border-radius:14px 14px 0 0}
.cl{display:flex;gap:20px}.cl.r{justify-content:flex-end}
.st{text-align:center}.st b{display:block;font-size:20px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap}.st span,#tm span{font-size:11px;color:var(--mute);white-space:nowrap}
#mid{display:flex;flex-direction:column;align-items:center;flex:none}
.pnl{display:none;flex:none;width:150px;flex-direction:column;justify-content:space-evenly;align-items:stretch;gap:12px;background:rgba(18,36,72,.92);border:1px solid rgba(130,170,240,.3);border-radius:14px;padding:14px 10px}
#wrap.side{flex-direction:row;gap:14px}
.side .pnl{display:flex}.side #hud{display:none}
.side .st b{font-size:34px}.side #tm b{font-size:56px}.side .st span,.side #tm span{font-size:13px}
.side .st{background:rgba(255,255,255,.05);border-radius:12px;padding:10px 4px}
.side .bg{border-radius:14px;border-top:1px solid rgba(130,170,240,.3)}.side .dim{border-radius:14px}
.trk{display:none;width:100%;height:6px;background:rgba(255,255,255,.15);border-radius:3px;overflow:hidden;margin-top:10px}
.side .trk{display:block}.trk i{display:block;height:100%;background:var(--lamp);transform-origin:left}
#tm{text-align:center;padding:0 4px}#tm b{display:block;font-size:32px;font-weight:800;color:var(--lamp);line-height:1;min-width:2.9em;font-variant-numeric:tabular-nums}#tm span{font-size:11px;color:var(--mute)}
#wrap{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:14px;touch-action:none;cursor:crosshair}
#stage{position:relative;flex:none}

.bg,.lens,.ib{background-image:var(--img)}
.bg{position:absolute;inset:0;background-size:100% 100%;border-radius:0 0 14px 14px;border:1px solid rgba(130,170,240,.3);border-top:0;box-shadow:0 10px 36px rgba(0,0,0,.55)}
.dim{position:absolute;inset:0;border-radius:0 0 14px 14px;background:rgba(6,14,30,.4);pointer-events:none}
.p{position:absolute;pointer-events:none;animation:bob 1.3s ease-in-out infinite alternate}
.p.done{animation:none}
@keyframes bob{to{transform:translateY(-4px)}}
.lens{position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 3px #fff,0 0 0 6px var(--c),0 12px 22px rgba(0,0,0,.6),0 0 30px var(--c);animation:pin .28s cubic-bezier(.2,1.5,.4,1);transition:transform .18s,opacity .18s,filter .18s}
@keyframes pin{from{transform:translateY(26px) scale(.35);opacity:0}to{transform:none;opacity:1}}
.p.done .lens{transform:scale(.55);opacity:0;filter:grayscale(1)}
.hit{position:absolute;inset:-12px;border-radius:50%;pointer-events:auto;touch-action:none}
.ring{position:absolute;inset:-11px;border-radius:50%;border:3px solid rgba(255,255,255,.9);pointer-events:none;animation:shr linear forwards}
@keyframes shr{from{transform:scale(1);opacity:1}to{transform:scale(.72);opacity:.15}}
.lab{position:absolute;left:50%;bottom:-24px;transform:translateX(-50%);white-space:nowrap;font-size:12px;font-weight:600;padding:1px 10px;border-radius:999px;background:rgba(10,20,44,.92);border:1px solid var(--c);color:#fff;pointer-events:none}
.fl{position:absolute;font-weight:800;font-size:20px;pointer-events:none;animation:up .8s forwards;transform:translateX(-50%);text-shadow:0 0 4px #000,0 1px 4px #000;z-index:5}
@keyframes up{to{transform:translate(-50%,-44px);opacity:0}}
#rot{margin-top:8px;display:none;text-align:center;font-size:13px;color:var(--mute);pointer-events:none}
@media (orientation:portrait){#rot{display:block}}
.screen{position:fixed;inset:0;z-index:7;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;text-align:center;background:linear-gradient(rgba(10,20,44,.82),rgba(6,12,28,.94));isolation:isolate;overflow:auto;cursor:default}
.screen::before{content:'';position:fixed;inset:0;z-index:-1;background:var(--img) center/cover;filter:blur(7px) saturate(.8);transform:scale(1.06)}
.screen.top{justify-content:flex-start;z-index:8}
.screen h1{margin:0;font-size:clamp(28px,8vw,46px);font-weight:800;line-height:1.15}
.screen h2{margin:0;font-size:22px;font-weight:800}
.screen p{margin:0;color:var(--mute);max-width:460px;line-height:1.55}
.legend,.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.legend span{background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:15px}
button{font:inherit;font-weight:600;font-size:18px;padding:12px 34px;border:0;border-radius:999px;background:var(--lamp);color:#2a1d00;cursor:pointer;box-shadow:0 6px 18px rgba(255,200,61,.25)}
button.g{background:transparent;color:var(--text);border:1px solid var(--line);box-shadow:none}
button.sm{font-size:15px;padding:8px 18px}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:2px}
.lg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lg button{border-radius:0;box-shadow:none;background:transparent;color:var(--mute);font-size:14px;padding:5px 14px}
.lg button.on{background:var(--lamp);color:#2a1d00}
.bar2{width:min(900px,100%);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;width:100%;max-width:360px}
.grid div{background:#1c3668;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.grid b{display:block;font-size:24px;font-weight:800}
.grid span{font-size:12px;color:var(--mute)}
.rank{font-size:20px;font-weight:600;color:var(--lamp)}
.nm{display:flex;gap:8px;width:100%;max-width:360px}
input{flex:1;min-width:0;font:inherit;font-size:17px;padding:10px 14px;border-radius:999px;border:1px solid var(--line);background:#0f2145;color:var(--text);user-select:text;-webkit-user-select:text}
.iw{width:min(900px,100%);max-height:52vh;overflow:auto;border-radius:10px;border:1px solid var(--line);flex:none}
.ib{position:relative;width:100%;aspect-ratio:1.7937;background-size:100% 100%;cursor:zoom-in}
.ib.z{width:230%;cursor:zoom-out}
.m{position:absolute;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50%;background:var(--lamp);color:#2a1d00;font-weight:800;font-size:15px;display:grid;place-items:center;border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.6);cursor:pointer;padding:0}
.m.on{background:#fff;transform:scale(1.25)}
.ul{width:min(900px,100%);display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px;text-align:left}
.ul div{background:#1c3668;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.ul div.on{border-color:var(--lamp);background:#244383}
.ul b{display:block;margin-bottom:2px}
.ul span{font-size:14px;color:var(--mute);line-height:1.5}
#rows{width:min(520px,100%);display:flex;flex-direction:column;gap:6px}
.rw{display:grid;grid-template-columns:34px 1fr auto auto;gap:10px;align-items:center;background:#1c3668;border:1px solid var(--line);border-radius:10px;padding:8px 12px;text-align:left}
.rw.me{border-color:var(--lamp);background:#244383}
.rw i{font-style:normal;font-weight:800;color:var(--lamp)}
.rw .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rw b{font-size:18px}.rw span{font-size:12px;color:var(--mute);min-width:3em;text-align:right}
.card{width:min(560px,100%);margin:auto;position:relative;overflow:hidden;background:rgba(16,32,64,.76);border:1px solid rgba(130,170,240,.28);border-radius:22px;padding:30px 22px 22px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 24px 70px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:16px;text-align:center}
.card::before{content:'';position:absolute;left:0;right:0;top:0;height:8px;background:repeating-linear-gradient(-45deg,#f2c200 0 12px,#1a1a1a 12px 24px)}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px}
.chip{font-size:13px;font-weight:600;color:#2a1d00;background:var(--lamp);padding:3px 12px;border-radius:999px}
.card h1{font-size:clamp(32px,9vw,50px);line-height:1.1}
.card h1 em{display:block;font-style:normal;font-size:.4em;font-weight:600;color:#7fe3ff;letter-spacing:.08em;margin-top:8px}
.lead{margin:0 auto;font-size:15px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.steps div{background:rgba(255,255,255,.06);border:1px solid rgba(130,170,240,.22);border-radius:14px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;line-height:1.4}
.steps i{font-style:normal;width:26px;height:26px;border-radius:50%;background:var(--lamp);color:#2a1d00;font-weight:800;display:grid;place-items:center}
.cta{display:flex;align-items:center;justify-content:center;gap:10px;font-size:20px;padding:15px 30px;width:100%;animation:pulse 2.2s infinite}
.cta svg{width:22px;height:22px}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,200,61,.5)}70%{box-shadow:0 0 0 14px rgba(255,200,61,0)}100%{box-shadow:0 0 0 0 rgba(255,200,61,0)}}
button.sm{display:inline-flex;align-items:center;gap:8px}
button.sm svg{width:18px;height:18px}
.rk{font-weight:600;font-size:15px;color:var(--lamp);background:rgba(255,200,61,.12);border:1px solid rgba(255,200,61,.45);border-radius:999px;padding:4px 14px}
.score{display:flex;align-items:baseline;justify-content:center;gap:10px}
.score b{font-size:clamp(56px,16vw,84px);font-weight:800;line-height:1;color:#fff;font-variant-numeric:tabular-nums}
.score span{font-size:20px;color:var(--mute)}
.card .grid{grid-template-columns:repeat(auto-fit,minmax(140px,1fr));max-width:none;width:100%}
.card .grid div{background:rgba(255,255,255,.06);border-color:rgba(130,170,240,.22)}
.card .nm{max-width:none}
.msg{min-height:1.2em;font-size:14px;color:var(--bad)}
.rw i{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.1);color:var(--text)}
.rw:nth-child(1) i{background:#ffd24a;color:#2a1d00}.rw:nth-child(2) i{background:#cfd8e3;color:#1a2433}.rw:nth-child(3) i{background:#d99a62;color:#2a1600}
#wipe{position:relative;overflow:hidden;color:#ffb3ab;border-color:rgba(255,107,94,.55);-webkit-touch-callout:none;touch-action:none}
#wipe::after{content:'';position:absolute;inset:0;background:rgba(255,107,94,.45);transform:scaleX(0);transform-origin:left;pointer-events:none}
#wipe.hold::after{transform:scaleX(1);transition:transform 2s linear}
.hide{display:none!important}
@media (prefers-reduced-motion:reduce){.lens,.p,.fl,.cta{animation:none}}
/* ---------- mobile responsive refinement (visual-only) ----------
   Preserve the original game, assets, HUD content and scoring logic. */
@media (max-width: 700px), (max-height: 500px){
  #wrap{padding:6px;}
  #hud{padding:6px 9px 9px;gap:7px;border-radius:11px 11px 0 0;}
  .cl{gap:8px;}
  .st b{font-size:clamp(15px,4.5vw,20px);}
  .st span,#tm span{font-size:clamp(9px,2.8vw,11px);}
  #tm b{font-size:clamp(24px,7vw,32px);min-width:2.5em;}
  .side .pnl{width:clamp(112px,26vw,150px);padding:9px 7px;gap:8px;}
  .side .st b{font-size:clamp(24px,7vw,34px);}
  .side #tm b{font-size:clamp(38px,10vw,56px);}
  .hit{inset:-18px;}
  #rot{display:none!important;}
}
@media (max-width: 380px){
  #hud{grid-template-columns:1fr auto 1fr;padding-left:6px;padding-right:6px;gap:4px;}
  .cl{gap:5px;}
  .st b{font-size:15px;}
  #tm b{font-size:24px;}
}
@media (max-height: 420px) and (orientation:landscape){
  #wrap{padding:4px;}
  #hud{padding-top:4px;padding-bottom:6px;}
  .side .pnl{padding:6px;gap:5px;}
  .side .st{padding:5px 2px;}
}

}

function spawn(now){
  var el=(now-t0)/DUR;
  if(live.length>=2)return;
  var h=null,i;
  if(!bag.length)bag=H.slice().sort(function(){return Math.random()-.5});
  for(i=0;i<bag.length;i++){
    var a=geo(bag[i]);

  }
  if(!h)return;
  var life=Math.max(1650,2300-el*650),d=document.createElement('div');

  d.querySelector('.lab').textContent=h.l[lang];
  var o={el:d,h:h,born:now,life:life,dying:false};
  d.querySelector('.hit').addEventListener('pointerdown',function(e){e.stopPropagation();e.preventDefault();hit(o)});
  stage.appendChild(d);place(o);live.push(o);
}
function drop(o){o.dying=true;live=live.filter(function(q){return q!==o});setTimeout(function(){o.el.remove()},220)}
function hit(o){
  if(!running||o.dying)return;
  clicks++;var rt=performance.now()-o.born;
  o.el.classList.add('done');
  hits++;streak++;bestStreak=Math.max(bestStreak,streak);rts.push(rt);
  var g=100+Math.max(0,Math.round((1000-rt)/10))+Math.min(streak,10)*5;pts+=g;flash(o.g.cx,o.g.cy-o.g.h/2-6,'+'+g,'#ffc83d');
  drop(o);hud();
}
wrap.addEventListener('pointerdown',function(e){
  if(!running||(e.target.closest&&e.target.closest('#hud,.pnl')))return;
  var r=stage.getBoundingClientRect();
  clicks++;streak=0;pts-=5;flash(e.clientX-r.left,e.clientY-r.top-10,tr('fMiss'),'#ffffff');hud();
});
function loop(){
  if(!running)return;
  var now=performance.now(),left=Math.max(0,DUR-(now-t0));
  $('tm').firstChild.textContent=(left/1000).toFixed(1);$('bar').style.transform=$('bar2').style.transform='scaleX('+(left/DUR)+')';
  if(left<=0){finish();return}
  if(now>=nextSpawn){spawn(now);var el=(now-t0)/DUR;nextSpawn=now+680-el*150+Math.random()*200}
  live.slice().forEach(function(o){
    if(!o.dying&&now-o.born>=o.life){
      missed++;streak=0;pts-=20;flash(o.g.cx,o.g.cy-o.g.h/2-6,tr('fLeak'),'#ff6b5e');hud();
      o.el.classList.add('done');drop(o);
    }
  });
  raf=requestAnimationFrame(loop);
}
function clear(){stage.querySelectorAll('.p,.fl').forEach(function(n){n.remove()});live=[]}
function show(id,on){$(id).classList.toggle('hide',!on)}
function start(){
  hits=clicks=missed=pts=streak=bestStreak=0;rts=[];bag=[];clear();layout();
  show('start',false);show('end',false);
  hud();running=true;t0=performance.now();nextSpawn=t0+500;$('bar').style.transform=$('bar2').style.transform='scaleX(1)';raf=requestAnimationFrame(loop);
}
function rankOf(s){var i=s>=2500?0:s>=1800?1:s>=1100?2:s>=500?3:4;return tr('ranks')[i]}
function best(){return +LS.get('sosbg_best')||0}
function showBest(){}
function finish(){
  running=false;cancelAnimationFrame(raf);clear();
  var acc=clicks?Math.round(hits/clicks*100):0,avg=rts.length?Math.round(rts.reduce(function(a,b){return a+b},0)/rts.length):0,score=Math.max(0,pts);
    lastR={score:score,hits:hits,acc:acc,avg:avg,streak:bestStreak,missed:missed};
  saved=false;$('nameIn').value=LS.get('sosbg_name')||'';$('nameIn').disabled=false;$('save').disabled=false;$('saveMsg').textContent='';
  fillEnd();show('end',true);
}
function fillEnd(){
  if(!lastR)return;var r=lastR;
  $('rank').textContent=rankOf(r.score);$('bigN').textContent=r.score;$('bigU').textContent=tr('pt').trim();
  var c=[[r.hits,tr('sHits')],[r.acc+'%',tr('sAcc')],[r.avg?r.avg+' ms':'-',tr('sAvg')],[r.streak,tr('sStreak')],[(r.hits*KWH).toFixed(2)+' kWh',tr('sSaved')],[(r.missed*KWH).toFixed(2)+' kWh',tr('sLeak')+' ('+r.missed+tr('spots')+')']];
  $('stats').innerHTML=c.map(function(x){return '<div><b>'+x[0]+'</b><span>'+x[1]+'</span></div>'}).join('');
  $('save').textContent=saved?tr('saved'):tr('save');
}

/* ---------- leaderboard: shared (db) with local fallback ---------- */
var db=null,canWrite=false,remote=null;
function localLb(){try{return JSON.parse(LS.get('sosbg_lb')||'[]')}catch(e){return[]}}
function initDb(){
  try{
    if(!window.claude||!claude.use)return;
    claude.use('db').then(function(d){
      if(!d)return;db=d;
      return claude.use('user').then(function(u){return u&&u.can?u.can('data.write'):null}).catch(function(){return null}).then(function(w){
        canWrite=(w!==false);
        db.collection('scores').orderBy('score','desc').limit(20).onSnapshot(function(s){remote=s.docs.map(function(x){return x.data()});renderBoard()},function(){remote=null;canWrite=false;renderBoard()});
      });
    }).catch(function(){db=null});
  }catch(e){db=null}
}
function renderBoard(){
  var shared=db&&remote!==null,rows=shared?remote:localLb();
  
  var box=$('rows');box.innerHTML='';
  if(!rows.length){var p=document.createElement('p');p.textContent=tr('empty');box.appendChild(p);return}
  rows.slice(0,20).forEach(function(e,i){
    var d=document.createElement('div');d.className='rw'+(e.ts===lastTs?' me':'');
    var a=document.createElement('i');a.textContent=i+1;
    var n=document.createElement('div');n.className='n';n.textContent=e.name;
    var s=document.createElement('b');s.textContent=e.score;
    var c=document.createElement('span');c.textContent=e.acc+'%';
    d.appendChild(a);d.appendChild(n);d.appendChild(s);d.appendChild(c);box.appendChild(d);
  });
}
function save(){
  if(saved||!lastR)return;
  var name=$('nameIn').value.replace(/\s+/g,' ').trim().slice(0,16);
  if(!name){$('saveMsg').textContent=tr('needName');$('nameIn').focus();return}
  saved=true;LS.set('sosbg_name',name);$('nameIn').disabled=true;$('save').disabled=true;$('save').textContent=tr('saved');
  var e={name:name,score:lastR.score,hits:lastR.hits,acc:lastR.acc,avg:lastR.avg,ts:Date.now(),lang:lang};lastTs=e.ts;
  var l=localLb();l.push(e);l.sort(function(a,b){return b.score-a.score});LS.set('sosbg_lb',JSON.stringify(l.slice(0,20)));
  function done(){renderBoard();show('board',true)}
  if(db&&canWrite){db.collection('scores').add(e).then(function(){done(tr('savedShared'))},function(){canWrite=false;done(tr('savedLocal'))})}
  else done(tr('savedLocal'));
}

/* ---------- full picture + explanations ---------- */
function buildInfo(){
  var ib=$('ib'),ul=$('ul');ib.innerHTML='';ul.innerHTML='';
  H.forEach(function(h,i){
    var m=document.createElement('button');m.className='m';m.textContent=i+1;m.style.left=(h.nx*100)+'%';m.style.top=(h.ny*100)+'%';m.setAttribute('aria-label',h.l[lang]);
    m.addEventListener('click',function(e){e.stopPropagation();pick(i,true)});ib.appendChild(m);
    var d=document.createElement('div'),b=document.createElement('b'),s=document.createElement('span');
    b.textContent=(i+1)+'. '+h.l[lang];s.textContent=h.d[lang];d.appendChild(b);d.appendChild(s);
    d.addEventListener('click',function(){pick(i,false)});ul.appendChild(d);
  });
}
function pick(i,scroll){
  [].forEach.call($('ib').children,function(m,k){m.classList.toggle('on',k===i)});
  [].forEach.call($('ul').children,function(d,k){d.classList.toggle('on',k===i)});
  if(scroll)$('ul').children[i].scrollIntoView({behavior:'smooth',block:'center'});
}
$('ib').addEventListener('click',function(){this.classList.toggle('z')});

/* ---------- wiring ---------- */
function applyLang(){
  document.documentElement.lang=lang;document.title=tr('doc');
  [].forEach.call(document.querySelectorAll('[data-i]'),function(e){e.innerHTML=tr(e.getAttribute('data-i'))});
  [].forEach.call(document.querySelectorAll('[data-p]'),function(e){e.placeholder=tr(e.getAttribute('data-p'))});
  [].forEach.call(document.querySelectorAll('.lg button'),function(b){b.classList.toggle('on',b.getAttribute('data-l')===lang)});
  showBest();buildInfo();renderBoard();fillEnd();
}
document.addEventListener('click',function(e){
  var b=e.target.closest&&e.target.closest('.lg button');
  if(b){lang=b.getAttribute('data-l');LS.set('sosbg_lang',lang);applyLang()}
});
[].forEach.call(document.querySelectorAll('[data-x]'),function(b){b.onclick=function(){show(b.getAttribute('data-x'),false)}});
$('go').onclick=start;$('again').onclick=function(){show('end',false);show('start',true)};$('save').onclick=save;
$('nameIn').addEventListener('keydown',function(e){if(e.key==='Enter')save()});
$('eInfo').onclick=function(){$('ib').classList.remove('z');show('info',true)};
$('eBoard').onclick=function(){renderBoard();show('board',true)};
var holdT=0,wb=$('wipe');
function wipeAll(){
  wb.classList.remove('hold');wb.disabled=true;wb.textContent=tr('wiping');LS.set('sosbg_lb','[]');
  function round(n){
    if(!db||n>8)return Promise.resolve();
    return db.collection('scores').limit(100).get().then(function(sn){
      if(sn.empty)return;
      return sn.docs.reduce(function(p,d){return p.then(function(){return db.doc('scores/'+d.id).delete()})},Promise.resolve()).then(function(){return round(n+1)});
    });
  }
  round(0).catch(function(){}).then(function(){wb.disabled=false;wb.textContent=tr('wipe');renderBoard()});
}
function wipeCancel(){clearTimeout(holdT);wb.classList.remove('hold')}
wb.addEventListener('pointerdown',function(e){if(wb.disabled)return;e.preventDefault();wb.classList.add('hold');holdT=setTimeout(wipeAll,2000)});
['pointerup','pointerleave','pointercancel'].forEach(function(ev){wb.addEventListener(ev,wipeCancel)});
wb.addEventListener('contextmenu',function(e){e.preventDefault()});
applyLang();layout();initDb();
})();
</script>
</body>
